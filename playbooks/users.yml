---
- name: Create web user
  hosts: all
  become: yes
  tasks:
    - name: Create wwwebapp user
      user:
        name: wwwebapp
        shell: /bin/bash
        create_home: yes

    - name: Ensure /opt/static-sites owned by wwwebapp
      file:
        path: /opt/static-sites
        state: directory
        owner: wwwebapp
        group: wwwebapp

